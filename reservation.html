<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation - BlanchiPro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">BlanchiPro</a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <nav class="nav-menu" id="navMenu">
        <a href="index.html">Accueil</a>
        <a href="services.html">Services</a>
        <a href="reservation.html" class="active">Réservation</a>
        <a href="suivi.html">Suivi</a>
        <a href="espace-pro.html">Espace Pro</a>
        <a href="login.html" class="btn btn-outline">Connexion</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1 class="section-title">Réserver une prestation</h1>
    <div class="card" style="max-width:700px; margin:0 auto;">
      <form id="reservationForm">
        <div class="form-row">
          <div class="form-group">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" required>
          </div>
          <div class="form-group">
            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="service">Service</label>
            <select id="service">
              <option>Lavage simple</option>
              <option>Lavage + Repassage</option>
              <option>Nettoyage à sec</option>
              <option>Retouche</option>
              <option>Service à domicile</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date">Date souhaitée</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="heure">Heure</label>
            <input type="time" id="heure">
          </div>
          <div class="form-group">
            <label for="adresse">Adresse (si à domicile)</label>
            <input type="text" id="adresse">
          </div>
        </div>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="4" placeholder="Précisions : type de linge, quantité, consignes particulières..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Confirmer la réservation</button>
      </form>
      <div id="reservationSuccess" class="alert alert-success hidden" style="margin-top:20px;">
        ✅ Votre réservation a été enregistrée ! Vous pouvez suivre son évolution dans l’espace Suivi.
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 BlanchiPro - Tous droits réservés.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
